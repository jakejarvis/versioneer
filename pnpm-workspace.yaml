packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@posthog/cli": true
  core-js: true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  workerd: true
catalog:
  "@cloudflare/vitest-pool-workers": ^0.14.9
  "@vitest/runner": npm:@voidzero-dev/vite-plus-test@0.1.20
  "@vitest/snapshot": npm:@voidzero-dev/vite-plus-test@0.1.20
  drizzle-orm: ^0.45.2
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.1.20
  vite-plus: 0.1.20
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.20
  wrangler: ^4.84.1
  zod: ^4.3.6
overrides:
  "@vitest/runner": "catalog:"
  "@vitest/snapshot": "catalog:"
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - "@vitest/runner"
    - "@vitest/snapshot"
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
