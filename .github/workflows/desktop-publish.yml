name: Desktop Publish

on:
  workflow_call:
    inputs:
      channel:
        description: Release channel, either stable or nightly.
        required: true
        type: string
      version:
        description: Marketing version to embed in the app.
        required: true
        type: string
      build_number:
        description: Build number to embed in the app.
        required: true
        type: string
      tag_name:
        description: GitHub release tag.
        required: true
        type: string
      release_title:
        description: GitHub release title and release notes page title.
        required: true
        type: string
      archive_stem:
        description: Filename stem for the zip and release notes artifact.
        required: true
        type: string
      r2_prefix:
        description: Optional R2 prefix for channel-specific artifacts.
        required: false
        type: string
        default: ""
      previous_tag:
        description: Previous release tag for generated nightly notes.
        required: false
        type: string
        default: ""
      compare_range:
        description: Git revision range for generated nightly notes.
        required: false
        type: string
        default: ""
      commit_label:
        description: Human-readable commit label for generated nightly notes.
        required: false
        type: string
        default: ""
      prerelease:
        description: Whether the GitHub release should be marked as a prerelease.
        required: false
        type: boolean
        default: false
      mark_latest:
        description: Whether the GitHub release should be marked as latest.
        required: false
        type: boolean
        default: false
      upload_github_asset:
        description: Whether to attach the zip to the GitHub release.
        required: false
        type: boolean
        default: false
    secrets:
      APPLE_SIGNING_CERTIFICATE_P12_BASE64:
        required: true
      APPLE_SIGNING_CERTIFICATE_PASSWORD:
        required: true
      APPLE_NOTARY_KEY_ID:
        required: true
      APPLE_NOTARY_ISSUER_ID:
        required: true
      APPLE_NOTARY_PRIVATE_KEY:
        required: true
      SPARKLE_PRIVATE_ED_KEY:
        required: true
      SPARKLE_PUBLIC_ED_KEY:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish desktop ${{ inputs.channel }}
    runs-on: macos-latest
    env:
      CHANNEL: ${{ inputs.channel }}
      DOWNLOADS_BUCKET: versioneer-releases
      DOWNLOADS_HOST: https://dl.versioneer.app
      R2_PREFIX: ${{ inputs.r2_prefix }}
      ARCHIVE_STEM: ${{ inputs.archive_stem }}
      TAG_NAME: ${{ inputs.tag_name }}
      RELEASE_TITLE: ${{ inputs.release_title }}
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
      COMPARE_RANGE: ${{ inputs.compare_range }}
      COMMIT_LABEL: ${{ inputs.commit_label }}
      PRERELEASE: ${{ inputs.prerelease }}
      MARK_LATEST: ${{ inputs.mark_latest }}
      GH_TOKEN: ${{ github.token }}
      APPLE_DEVELOPER_IDENTITY: ${{ vars.APPLE_DEVELOPER_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12_BASE64 }}
      APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
      SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
      SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
      POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true
          run-install: true

      - name: Ensure stable GitHub release exists
        if: ${{ inputs.channel == 'stable' }}
        run: |
          set -euo pipefail

          release_flags=(--title "$RELEASE_TITLE")
          if [ "$MARK_LATEST" = "true" ]; then
            release_flags+=(--latest)
          else
            release_flags+=(--latest=false)
          fi

          if gh release view "$TAG_NAME" --json id >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" "${release_flags[@]}"
          else
            gh release create "$TAG_NAME" \
              "${release_flags[@]}" \
              --generate-notes \
              --target "${GITHUB_SHA}"
          fi

      - name: Capture stable release body
        if: ${{ inputs.channel == 'stable' }}
        run: gh release view "$TAG_NAME" --json body --jq .body >
          "$RUNNER_TEMP/release-notes.md"

      - name: Render nightly release notes
        if: ${{ inputs.channel == 'nightly' }}
        run: |
          set -euo pipefail

          url_for() {
            local path="$1"

            if [ -n "$R2_PREFIX" ]; then
              printf '%s/%s/%s' "$DOWNLOADS_HOST" "$R2_PREFIX" "$path"
            else
              printf '%s/%s' "$DOWNLOADS_HOST" "$path"
            fi
          }

          display_commit="${COMMIT_LABEL:-$GITHUB_SHA}"

          {
            echo "## Nightly build"
            echo
            echo "- Base version: ${VERSION}"
            echo "- Build number: ${BUILD_NUMBER}"
            echo "- Commit: \`${display_commit}\`"
            echo "- Published: $(date -u '+%Y-%m-%d %H:%M UTC')"
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "- Previous nightly: \`${PREVIOUS_TAG}\`"
              echo "- Compare: [${PREVIOUS_TAG}...${display_commit}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${GITHUB_SHA})"
            fi
            echo
            echo "## Downloads"
            echo
            echo "- Direct download: $(url_for "downloads/${ARCHIVE_STEM}.zip")"
            echo "- Sparkle appcast: $(url_for "appcast.xml")"
            echo "- Latest nightly alias: $(url_for "latest/Versioneer.zip")"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "## Desktop changes since ${PREVIOUS_TAG}"
              echo
              git log --reverse --pretty='- %s (%h)' "$COMPARE_RANGE" -- apps/desktop
            else
              echo "## Desktop changes"
              echo
              echo "- First nightly release from the current history."
            fi
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/versioneer-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/versioneer-signing.p12"

          printf '%s' "$APPLE_SIGNING_CERTIFICATE_P12_BASE64" | base64 -D > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Resolve package dependencies
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.build/DerivedData" "$PWD/.build/DerivedData/SourcePackages"
          xcodebuild \
            -resolvePackageDependencies \
            -project apps/desktop/Versioneer.xcodeproj \
            -scheme Versioneer \
            -derivedDataPath "$PWD/.build/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/.build/DerivedData/SourcePackages"

      - name: Run unit tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/desktop/Versioneer.xcodeproj \
            -scheme Versioneer \
            -destination 'platform=macOS' \
            -derivedDataPath "$PWD/.build/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/.build/DerivedData/SourcePackages" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

      - name: Locate Sparkle tools
        run: |
          set -euo pipefail
          SPARKLE_BIN_DIR="$(dirname "$(find "$PWD/.build/DerivedData" "$HOME/Library/Caches/org.swift.swiftpm" -path '*Sparkle/bin/generate_appcast' -print -quit)")"
          if [ -z "$SPARKLE_BIN_DIR" ]; then
            echo "Could not locate Sparkle release tools." >&2
            exit 1
          fi
          echo "SPARKLE_BIN_DIR=$SPARKLE_BIN_DIR" >> "$GITHUB_ENV"

      - name: Install PostHog CLI
        run: npm install -g @posthog/cli@latest

      - name: Archive release build
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/desktop/Versioneer.xcodeproj \
            -scheme Versioneer \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Versioneer.xcarchive" \
            -derivedDataPath "$PWD/.build/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/.build/DerivedData/SourcePackages" \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$APPLE_DEVELOPER_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            POSTHOG_HOST="$POSTHOG_HOST" \
            POSTHOG_PROJECT_TOKEN="$POSTHOG_PROJECT_TOKEN"

      - name: Notarize and package app
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/Versioneer.xcarchive/Products/Applications/Versioneer.app"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          ARCHIVES_DIR="$RUNNER_TEMP/sparkle-archives"
          ARCHIVE_ZIP_PATH="$ARCHIVES_DIR/${ARCHIVE_STEM}.zip"

          mkdir -p "$ARCHIVES_DIR"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY" > "$NOTARY_KEY_PATH"

          xcrun notarytool submit "$APP_PATH" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait

          xcrun stapler staple "$APP_PATH"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARCHIVE_ZIP_PATH"

          {
            echo "ARCHIVES_DIR=$ARCHIVES_DIR"
            echo "ARCHIVE_ZIP_PATH=$ARCHIVE_ZIP_PATH"
          } >> "$GITHUB_ENV"

      - name: Render release notes HTML
        run: |
          set -euo pipefail
          BODY_HTML=$(npx --yes marked < "$RUNNER_TEMP/release-notes.md")

          cat > "$ARCHIVES_DIR/${ARCHIVE_STEM}.html" <<HTMLEOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>${RELEASE_TITLE}</title>
            <style>
              :root { color-scheme: light dark; }
              body { margin: 0; background: #0f172a; color: #e2e8f0;
                     font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
              main { max-width: 760px; margin: 0 auto; padding: 48px 24px 64px; }
              h1, h2, h3, h4, h5, h6 { color: #f8fafc; line-height: 1.2; }
              a { color: #7dd3fc; }
              code, pre { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
                          background: rgba(15, 23, 42, 0.45); border-radius: 10px; }
              code { padding: 0.15em 0.35em; }
              pre { overflow-x: auto; padding: 14px 16px; }
              blockquote { margin: 0; padding-left: 16px;
                           border-left: 3px solid rgba(125, 211, 252, 0.45); color: #cbd5e1; }
              img { max-width: 100%; height: auto; }
              table { width: 100%; border-collapse: collapse; }
              th, td { padding: 8px 10px; border: 1px solid rgba(148, 163, 184, 0.25); }
              hr { border: 0; border-top: 1px solid rgba(148, 163, 184, 0.2); }
            </style>
          </head>
          <body>
            <main>
              <h1>${RELEASE_TITLE}</h1>
              ${BODY_HTML}
            </main>
          </body>
          </html>
          HTMLEOF

          if [ "$CHANNEL" = "stable" ] && [ "$ARCHIVE_STEM" != "$VERSION" ]; then
            cp "$ARCHIVES_DIR/${ARCHIVE_STEM}.html" "$ARCHIVES_DIR/${VERSION}.html"
          fi

      - name: Generate Sparkle appcast
        run: |
          set -euo pipefail

          url_for() {
            local path="$1"

            if [ -n "$R2_PREFIX" ]; then
              printf '%s/%s/%s' "$DOWNLOADS_HOST" "$R2_PREFIX" "$path"
            else
              printf '%s/%s' "$DOWNLOADS_HOST" "$path"
            fi
          }

          download_url_prefix="$(url_for "downloads")"
          release_notes_url_prefix="$(url_for "release-notes")"

          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | "$SPARKLE_BIN_DIR/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "${download_url_prefix}/" \
            --release-notes-url-prefix "${release_notes_url_prefix}/" \
            --link "https://versioneer.app" \
            "$ARCHIVES_DIR"

          if [ "$CHANNEL" = "stable" ] && [ "$ARCHIVE_STEM" != "$VERSION" ]; then
            cp "$ARCHIVES_DIR/${ARCHIVE_STEM}.html" "$ARCHIVES_DIR/${VERSION}.html"
            perl -0pi -e 's/\Q'"$release_notes_url_prefix/$ARCHIVE_STEM.html"'\E/'"$release_notes_url_prefix/$VERSION.html"'/g' "$ARCHIVES_DIR/appcast.xml"
            printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | "$SPARKLE_BIN_DIR/sign_update" --ed-key-file - "$ARCHIVES_DIR/appcast.xml"
          fi

      - name: Upload release artifacts to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          WRANGLER="vp pm --filter @versioneer/web exec wrangler"

          object_key() {
            local path="$1"

            if [ -n "$R2_PREFIX" ]; then
              printf '%s/%s' "$R2_PREFIX" "$path"
            else
              printf '%s' "$path"
            fi
          }

          $WRANGLER r2 object put "$DOWNLOADS_BUCKET/$(object_key "downloads/${ARCHIVE_STEM}.zip")" \
            --file "$ARCHIVES_DIR/${ARCHIVE_STEM}.zip" \
            --remote \
            --content-type application/zip

          $WRANGLER r2 object put "$DOWNLOADS_BUCKET/$(object_key "release-notes/${ARCHIVE_STEM}.html")" \
            --file "$ARCHIVES_DIR/${ARCHIVE_STEM}.html" \
            --remote \
            --content-type "text/html; charset=utf-8"

          if [ "$CHANNEL" = "stable" ] && [ "$ARCHIVE_STEM" != "$VERSION" ]; then
            $WRANGLER r2 object put "$DOWNLOADS_BUCKET/$(object_key "release-notes/${VERSION}.html")" \
              --file "$ARCHIVES_DIR/${VERSION}.html" \
              --remote \
              --content-type "text/html; charset=utf-8"
          fi

          $WRANGLER r2 object put "$DOWNLOADS_BUCKET/$(object_key "appcast.xml")" \
            --file "$ARCHIVES_DIR/appcast.xml" \
            --remote \
            --content-type "application/xml; charset=utf-8"

          $WRANGLER r2 object put "$DOWNLOADS_BUCKET/$(object_key "latest/Versioneer.zip")" \
            --file "$ARCHIVES_DIR/${ARCHIVE_STEM}.zip" \
            --remote \
            --content-type application/zip

      - name: Publish GitHub release asset
        if: ${{ inputs.upload_github_asset }}
        run: |
          set -euo pipefail
          ASSET_LABEL="${ARCHIVE_STEM}.zip"

          release_flags=(
            --title "$RELEASE_TITLE"
            --notes-file "$RUNNER_TEMP/release-notes.md"
          )

          if [ "$PRERELEASE" = "true" ]; then
            release_flags+=(--prerelease)
          fi

          if [ "$MARK_LATEST" = "true" ]; then
            release_flags+=(--latest)
          else
            release_flags+=(--latest=false)
          fi

          if gh release view "$TAG_NAME" --json id >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" "${release_flags[@]}"
            gh release upload "$TAG_NAME" "$ARCHIVE_ZIP_PATH#${ASSET_LABEL}" --clobber
          else
            gh release create "$TAG_NAME" \
              "$ARCHIVE_ZIP_PATH#${ASSET_LABEL}" \
              "${release_flags[@]}" \
              --target "${GITHUB_SHA}"
          fi
