name: Desktop Publish

on:
  workflow_call:
    inputs:
      channel:
        description: Release channel, either stable or nightly.
        required: true
        type: string
      version:
        description: Marketing version to embed in the app.
        required: true
        type: string
      build_number:
        description: Build number to embed in the app.
        required: true
        type: string
      tag_name:
        description: GitHub release tag.
        required: true
        type: string
      release_title:
        description: GitHub release title and release notes page title.
        required: true
        type: string
      archive_stem:
        description: Filename stem for downloadable artifacts.
        required: true
        type: string
      release_notes_stem:
        description: Filename stem for release notes HTML.
        required: true
        type: string
      r2_prefix:
        description: Optional R2 prefix for channel-specific artifacts.
        required: false
        type: string
        default: ""
      previous_tag:
        description: Previous release tag for generated release notes.
        required: false
        type: string
        default: ""
      compare_range:
        description: Git revision range for generated release notes.
        required: false
        type: string
        default: ""
      prerelease:
        description: Whether the GitHub release should be marked as a prerelease.
        required: false
        type: boolean
        default: false
      mark_latest:
        description: Whether the GitHub release should be marked as latest.
        required: false
        type: boolean
        default: false
      upload_github_asset:
        description: Whether to attach downloadable artifacts to the GitHub release.
        required: false
        type: boolean
        default: false
    secrets:
      APPLE_SIGNING_CERTIFICATE_P12_BASE64:
        required: true
      APPLE_SIGNING_CERTIFICATE_PASSWORD:
        required: true
      APPLE_NOTARY_KEY_ID:
        required: true
      APPLE_NOTARY_ISSUER_ID:
        required: true
      APPLE_NOTARY_PRIVATE_KEY:
        required: true
      SPARKLE_PRIVATE_ED_KEY:
        required: true
      SPARKLE_PUBLIC_ED_KEY:
        required: true
      POSTHOG_CLI_API_KEY:
        required: false
      POSTHOG_CLI_PROJECT_ID:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish desktop ${{ inputs.channel }}
    runs-on: macos-26
    env:
      CHANNEL: ${{ inputs.channel }}
      DOWNLOADS_BUCKET: versioneer-releases
      DOWNLOADS_HOST: https://dl.versioneer.app
      R2_PREFIX: ${{ inputs.r2_prefix }}
      ARCHIVE_STEM: ${{ inputs.archive_stem }}
      RELEASE_NOTES_STEM: ${{ inputs.release_notes_stem }}
      TAG_NAME: ${{ inputs.tag_name }}
      RELEASE_TITLE: ${{ inputs.release_title }}
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
      COMPARE_RANGE: ${{ inputs.compare_range }}
      PRERELEASE: ${{ inputs.prerelease }}
      MARK_LATEST: ${{ inputs.mark_latest }}
      GH_TOKEN: ${{ github.token }}
      APPLE_DEVELOPER_IDENTITY: ${{ vars.APPLE_DEVELOPER_IDENTITY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12_BASE64 }}
      APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
      SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
      SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
      POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID || secrets.POSTHOG_CLI_PROJECT_ID }}
      POSTHOG_CLI_HOST: ${{ vars.POSTHOG_CLI_HOST }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true
          run-install: true

      - name: Generate release notes
        run: |
          set -euo pipefail

          release_paths=(
            apps/desktop
          )

          previous_tag="$PREVIOUS_TAG"
          compare_range="$COMPARE_RANGE"
          changes_file="$RUNNER_TEMP/release-changes.md"

          if [ -z "$previous_tag" ] && [ "$CHANNEL" = "stable" ]; then
            previous_tag="$(
              git tag -l 'v*' --sort=-version:refname | awk -v current="$TAG_NAME" '$0 != current { print; exit }'
            )"
          fi

          if [ -z "$compare_range" ] && [ -n "$previous_tag" ]; then
            compare_range="${previous_tag}..HEAD"
          fi

          : > "$changes_file"
          if [ -n "$compare_range" ]; then
            git log --reverse --pretty='- %s (%h)' "$compare_range" -- "${release_paths[@]}" > "$changes_file"
          fi

          {
            echo "## Changes"
            echo

            if [ -s "$changes_file" ]; then
              cat "$changes_file"
            elif [ -n "$previous_tag" ]; then
              echo "- No desktop changes since ${previous_tag}."
            else
              echo "- Initial desktop release."
            fi
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/versioneer-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/versioneer-signing.p12"

          printf '%s' "$APPLE_SIGNING_CERTIFICATE_P12_BASE64" | base64 -D > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project apps/desktop/Versioneer.xcodeproj \
            -scheme Versioneer \
            -destination 'platform=macOS' \
            -derivedDataPath "$PWD/.build/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/.build/DerivedData/SourcePackages" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test

      - name: Prepare PostHog dSYM upload
        run: |
          set -euo pipefail

          if [ -z "${POSTHOG_CLI_API_KEY:-}" ] || [ -z "${POSTHOG_CLI_PROJECT_ID:-}" ]; then
            echo "POSTHOG_CLI_API_KEY and POSTHOG_CLI_PROJECT_ID are required for release dSYM upload." >&2
            exit 1
          fi

          npm install -g @posthog/cli@latest

      - name: Build Developer ID app
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/Versioneer.xcarchive"
          EXPORT_PATH="$RUNNER_TEMP/Versioneer-export"
          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild \
            -project apps/desktop/Versioneer.xcodeproj \
            -scheme Versioneer \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$PWD/.build/DerivedData" \
            -clonedSourcePackagesDirPath "$PWD/.build/DerivedData/SourcePackages" \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$APPLE_DEVELOPER_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="\$(inherited) --keychain $KEYCHAIN_PATH --timestamp" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            VERSIONEER_RELEASE_TRACK="$CHANNEL" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            POSTHOG_HOST="$POSTHOG_HOST" \
            POSTHOG_PROJECT_TOKEN="$POSTHOG_PROJECT_TOKEN"

          cat > "$EXPORT_OPTIONS_PATH" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>developer-id</string>
            <key>signingCertificate</key>
            <string>${APPLE_DEVELOPER_IDENTITY}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH"

          APP_PATH="$EXPORT_PATH/Versioneer.app"
          test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Notarize app and build release artifacts
        run: |
          set -euo pipefail
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          NOTARY_ZIP_PATH="$RUNNER_TEMP/${ARCHIVE_STEM}-notary-upload.zip"
          ARCHIVES_DIR="$RUNNER_TEMP/sparkle-archives"
          ARCHIVE_ZIP_PATH="$ARCHIVES_DIR/${ARCHIVE_STEM}.zip"
          # Keep the DMG outside Sparkle's archive directory so generate_appcast only sees the zip artifact.
          ARCHIVE_DMG_PATH="$RUNNER_TEMP/${ARCHIVE_STEM}.dmg"
          DMG_STAGING_DIR="$RUNNER_TEMP/${ARCHIVE_STEM}-dmg-root"

          mkdir -p "$ARCHIVES_DIR"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY" > "$NOTARY_KEY_PATH"

          notarize_distribution() {
            local artifact_path="$1"
            local artifact_name artifact_stem result_path log_path submission_id submission_status
            local submit_status=0

            artifact_name="$(basename "$artifact_path")"
            artifact_stem="${artifact_name%.*}"
            result_path="$RUNNER_TEMP/${artifact_stem}-notary-result.json"
            log_path="$RUNNER_TEMP/${artifact_stem}-notary-log.json"

            xcrun notarytool submit "$artifact_path" \
              --key "$NOTARY_KEY_PATH" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER_ID" \
              --wait \
              --output-format json > "$result_path" || submit_status=$?

            submission_id="$(plutil -extract id raw -o - "$result_path" 2>/dev/null || true)"
            submission_status="$(plutil -extract status raw -o - "$result_path" 2>/dev/null || true)"

            if [ "$submit_status" -ne 0 ] || [ "$submission_status" != "Accepted" ]; then
              echo "Notarization failed for ${artifact_name} with status: ${submission_status:-Unknown}" >&2
              if [ -n "$submission_id" ]; then
                xcrun notarytool log \
                  --key "$NOTARY_KEY_PATH" \
                  --key-id "$APPLE_NOTARY_KEY_ID" \
                  --issuer "$APPLE_NOTARY_ISSUER_ID" \
                  "$submission_id" \
                  "$log_path" || true
                if [ -f "$log_path" ]; then
                  cat "$log_path" >&2
                fi
              elif [ -s "$result_path" ]; then
                cat "$result_path" >&2
              fi
              exit 1
            fi
          }

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$NOTARY_ZIP_PATH"
          notarize_distribution "$NOTARY_ZIP_PATH"
          rm -f "$NOTARY_ZIP_PATH"
          xcrun stapler staple "$APP_PATH"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARCHIVE_ZIP_PATH"

          mkdir -p "$DMG_STAGING_DIR"
          /usr/bin/ditto "$APP_PATH" "$DMG_STAGING_DIR/Versioneer.app"
          ln -s /Applications "$DMG_STAGING_DIR/Applications"

          /usr/bin/hdiutil create \
            -srcfolder "$DMG_STAGING_DIR" \
            -volname "Versioneer" \
            -format UDZO \
            -ov \
            "$ARCHIVE_DMG_PATH"

          DMG_SIGNING_IDENTIFIER="$(
            plutil -extract CFBundleIdentifier raw -o - "$APP_PATH/Contents/Info.plist"
          ).distribution-dmg"

          codesign \
            --force \
            --sign "$APPLE_DEVELOPER_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            --timestamp \
            --identifier "$DMG_SIGNING_IDENTIFIER" \
            "$ARCHIVE_DMG_PATH"
          codesign --verify --verbose=2 "$ARCHIVE_DMG_PATH"
          spctl -a -t open --context context:primary-signature -v "$ARCHIVE_DMG_PATH"

          notarize_distribution "$ARCHIVE_DMG_PATH"
          xcrun stapler staple "$ARCHIVE_DMG_PATH"

          {
            echo "ARCHIVES_DIR=$ARCHIVES_DIR"
            echo "ARCHIVE_ZIP_PATH=$ARCHIVE_ZIP_PATH"
            echo "ARCHIVE_DMG_PATH=$ARCHIVE_DMG_PATH"
          } >> "$GITHUB_ENV"

      - name: Render release notes HTML
        run: |
          set -euo pipefail
          BODY_HTML=$(npx --yes marked < "$RUNNER_TEMP/release-notes.md")

          cat > "$ARCHIVES_DIR/${RELEASE_NOTES_STEM}.html" <<HTMLEOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>${RELEASE_TITLE}</title>
            <style>
              :root { color-scheme: light dark; }
              body { margin: 0; background: #0f172a; color: #e2e8f0;
                     font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
              main { max-width: 760px; margin: 0 auto; padding: 48px 24px 64px; }
              h1, h2, h3, h4, h5, h6 { color: #f8fafc; line-height: 1.2; }
              a { color: #7dd3fc; }
              code, pre { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
                          background: rgba(15, 23, 42, 0.45); border-radius: 10px; }
              code { padding: 0.15em 0.35em; }
              pre { overflow-x: auto; padding: 14px 16px; }
              blockquote { margin: 0; padding-left: 16px;
                           border-left: 3px solid rgba(125, 211, 252, 0.45); color: #cbd5e1; }
              img { max-width: 100%; height: auto; }
              table { width: 100%; border-collapse: collapse; }
              th, td { padding: 8px 10px; border: 1px solid rgba(148, 163, 184, 0.25); }
              hr { border: 0; border-top: 1px solid rgba(148, 163, 184, 0.2); }
            </style>
          </head>
          <body>
            <main>
              <h1>${RELEASE_TITLE}</h1>
              ${BODY_HTML}
            </main>
          </body>
          </html>
          HTMLEOF

      - name: Generate Sparkle appcast
        run: |
          set -euo pipefail
          sparkle_search_roots=("$PWD/.build/DerivedData")
          if [ -d "$HOME/Library/Caches/org.swift.swiftpm" ]; then
            sparkle_search_roots+=("$HOME/Library/Caches/org.swift.swiftpm")
          fi

          GENERATE_APPCAST_PATH="$(find "${sparkle_search_roots[@]}" -path '*Sparkle/bin/generate_appcast' -type f -print -quit)"
          if [ -z "$GENERATE_APPCAST_PATH" ] || [ ! -x "$GENERATE_APPCAST_PATH" ]; then
            echo "Could not locate Sparkle generate_appcast." >&2
            exit 1
          fi
          SPARKLE_BIN_DIR="$(dirname "$GENERATE_APPCAST_PATH")"
          if [ ! -x "$SPARKLE_BIN_DIR/sign_update" ]; then
            echo "Could not locate Sparkle sign_update." >&2
            exit 1
          fi

          url_for() {
            local path="$1"

            if [ -n "$R2_PREFIX" ]; then
              printf '%s/%s/%s' "$DOWNLOADS_HOST" "$R2_PREFIX" "$path"
            else
              printf '%s/%s' "$DOWNLOADS_HOST" "$path"
            fi
          }

          download_url_prefix="$(url_for "downloads")"
          release_notes_url_prefix="$(url_for "release-notes")"

          root_appcast_url="${DOWNLOADS_HOST}/appcast.xml"
          if curl -fsSL "$root_appcast_url" -o "$ARCHIVES_DIR/appcast.xml"; then
            echo "Downloaded existing appcast from ${root_appcast_url}"
          else
            echo "No existing appcast found at ${root_appcast_url}; generating a new feed."
            rm -f "$ARCHIVES_DIR/appcast.xml"
          fi

          generate_appcast_args=(
            --ed-key-file -
            --download-url-prefix "${download_url_prefix}/"
            --release-notes-url-prefix "${release_notes_url_prefix}/"
            --link "https://versioneer.app"
          )

          if [ "$CHANNEL" = "nightly" ]; then
            generate_appcast_args+=(--channel nightly)
          fi

          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | "$SPARKLE_BIN_DIR/generate_appcast" \
            "${generate_appcast_args[@]}" \
            "$ARCHIVES_DIR"

          if [ "$ARCHIVE_STEM" != "$RELEASE_NOTES_STEM" ]; then
            perl -0pi -e 's/\Q'"$release_notes_url_prefix/$ARCHIVE_STEM.html"'\E/'"$release_notes_url_prefix/$RELEASE_NOTES_STEM.html"'/g' "$ARCHIVES_DIR/appcast.xml"
            printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | "$SPARKLE_BIN_DIR/sign_update" --ed-key-file - "$ARCHIVES_DIR/appcast.xml"
          fi

      - name: Upload release artifacts to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          WRANGLER=(npx --yes wrangler)

          object_key() {
            local path="$1"

            if [ -n "$R2_PREFIX" ]; then
              printf '%s/%s' "$R2_PREFIX" "$path"
            else
              printf '%s' "$path"
            fi
          }

          "${WRANGLER[@]}" r2 object put "$DOWNLOADS_BUCKET/$(object_key "downloads/${ARCHIVE_STEM}.zip")" \
            --file "$ARCHIVES_DIR/${ARCHIVE_STEM}.zip" \
            --remote \
            --content-type application/zip

          "${WRANGLER[@]}" r2 object put "$DOWNLOADS_BUCKET/$(object_key "downloads/${ARCHIVE_STEM}.dmg")" \
            --file "$ARCHIVE_DMG_PATH" \
            --remote \
            --content-type application/x-apple-diskimage

          "${WRANGLER[@]}" r2 object put "$DOWNLOADS_BUCKET/$(object_key "release-notes/${RELEASE_NOTES_STEM}.html")" \
            --file "$ARCHIVES_DIR/${RELEASE_NOTES_STEM}.html" \
            --remote \
            --content-type "text/html; charset=utf-8"

          "${WRANGLER[@]}" r2 object put "$DOWNLOADS_BUCKET/appcast.xml" \
            --file "$ARCHIVES_DIR/appcast.xml" \
            --remote \
            --content-type "application/xml; charset=utf-8"

          "${WRANGLER[@]}" r2 object put "$DOWNLOADS_BUCKET/$(object_key "latest/Versioneer.zip")" \
            --file "$ARCHIVES_DIR/${ARCHIVE_STEM}.zip" \
            --remote \
            --content-type application/zip

          "${WRANGLER[@]}" r2 object put "$DOWNLOADS_BUCKET/$(object_key "latest/Versioneer.dmg")" \
            --file "$ARCHIVE_DMG_PATH" \
            --remote \
            --content-type application/x-apple-diskimage

      - name: Publish GitHub release
        if: ${{ inputs.upload_github_asset || inputs.channel == 'stable' }}
        run: |
          set -euo pipefail
          ZIP_ASSET_LABEL="${ARCHIVE_STEM}.zip"
          DMG_ASSET_LABEL="${ARCHIVE_STEM}.dmg"

          release_flags=(
            --title "$RELEASE_TITLE"
            --notes-file "$RUNNER_TEMP/release-notes.md"
          )

          if [ "$PRERELEASE" = "true" ]; then
            release_flags+=(--prerelease)
          fi

          if [ "$MARK_LATEST" = "true" ]; then
            release_flags+=(--latest)
          else
            release_flags+=(--latest=false)
          fi

          release_assets=(
            "$ARCHIVE_ZIP_PATH#${ZIP_ASSET_LABEL}"
            "$ARCHIVE_DMG_PATH#${DMG_ASSET_LABEL}"
          )

          if gh release view "$TAG_NAME" --json id >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" "${release_flags[@]}"
            if [ "$UPLOAD_GITHUB_ASSET" = "true" ]; then
              gh release upload "$TAG_NAME" "${release_assets[@]}" --clobber
            fi
          else
            if [ "$UPLOAD_GITHUB_ASSET" = "true" ]; then
              gh release create "$TAG_NAME" \
                "${release_assets[@]}" \
                "${release_flags[@]}" \
                --target "${GITHUB_SHA}"
            else
              gh release create "$TAG_NAME" \
                "${release_flags[@]}" \
                --target "${GITHUB_SHA}"
            fi
          fi
        env:
          UPLOAD_GITHUB_ASSET: ${{ inputs.upload_github_asset }}
