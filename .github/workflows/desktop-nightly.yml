name: Desktop Nightly

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-nightly-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check desktop changes
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.meta.outputs.should_publish }}
      previous_tag: ${{ steps.meta.outputs.previous_tag }}
      compare_range: ${{ steps.meta.outputs.compare_range }}
      marketing_version: ${{ steps.meta.outputs.marketing_version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_title: ${{ steps.meta.outputs.release_title }}
      archive_stem: ${{ steps.meta.outputs.archive_stem }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute nightly metadata
        id: meta
        run: |
          set -euo pipefail

          previous_tag="$(git tag -l --sort=-creatordate "nightly-*" | head -n 1)"
          compare_range=""
          should_publish="true"

          if [ -n "$previous_tag" ]; then
            compare_range="${previous_tag}..HEAD"
            if git diff --quiet "$compare_range" -- apps/desktop; then
              should_publish="false"
            fi
          fi

          marketing_version="$(
            sed -nE 's/.*MARKETING_VERSION = ([^;]+);.*/\1/p' apps/desktop/Versioneer.xcodeproj/project.pbxproj | head -n 1
          )"

          if [ -z "$marketing_version" ]; then
            echo "Could not determine MARKETING_VERSION from apps/desktop/Versioneer.xcodeproj/project.pbxproj" >&2
            exit 1
          fi

          short_sha="$(git rev-parse --short=8 HEAD)"
          date_stamp="$(date -u +%Y%m%d)"
          build_number="$(date -u +%Y%m%d%H%M%S)"
          tag_name="nightly-${date_stamp}-${short_sha}"
          release_title="$tag_name"
          archive_stem="Versioneer-${tag_name}"

          {
            echo "should_publish=$should_publish"
            echo "previous_tag=$previous_tag"
            echo "compare_range=$compare_range"
            echo "marketing_version=$marketing_version"
            echo "build_number=$build_number"
            echo "tag_name=$tag_name"
            echo "release_title=$release_title"
            echo "archive_stem=$archive_stem"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish desktop nightly
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    uses: ./.github/workflows/desktop-publish.yml
    with:
      channel: nightly
      version: ${{ needs.prepare.outputs.marketing_version }}
      build_number: ${{ needs.prepare.outputs.build_number }}
      tag_name: ${{ needs.prepare.outputs.tag_name }}
      release_title: ${{ needs.prepare.outputs.release_title }}
      archive_stem: ${{ needs.prepare.outputs.archive_stem }}
      r2_prefix: nightly
      previous_tag: ${{ needs.prepare.outputs.previous_tag }}
      compare_range: ${{ needs.prepare.outputs.compare_range }}
      prerelease: true
      mark_latest: false
      upload_github_asset: true
    secrets: inherit

  skipped:
    name: Skip nightly publish
    needs: prepare
    if: needs.prepare.outputs.should_publish != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report skipped publish
        run: |
          echo "No changes under apps/desktop since ${PREVIOUS_TAG:-the previous nightly release}; skipping."
        env:
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
